<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Betting & Props</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🏈 NFL Betting Hub</h1>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Schedule</a></li>
                <li><a href="props.html">Props Builder</a></li>
            </ul>
        </div>
    </nav>

    <div class="container schedule-container">
        <main class="main-content full-width">
            <!-- Schedule Section -->
            <section id="schedule" class="feature-section">
                <div class="header-section">
                    <h2>NFL Schedule</h2>
                    <div class="week-selector">
                        <button class="week-nav" id="prevWeek">‹</button>
                        <span id="weekDisplay">Week 12</span>
                        <button class="week-nav" id="nextWeek">›</button>
                    </div>
                </div>

                <!-- Day tabs -->
                <div class="day-tabs" id="dayTabs">
                    <button class="day-tab active" data-day="0">Today</button>
                    <button class="day-tab" data-day="1">Tomorrow</button>
                    <button class="day-tab" data-day="2">Wed</button>
                    <button class="day-tab" data-day="3">Thu</button>
                    <button class="day-tab" data-day="4">Fri</button>
                    <button class="day-tab" data-day="5">Sat</button>
                    <button class="day-tab" data-day="6">Sun</button>
                </div>

                <!-- Games Grid -->
                <div class="games-grid" id="gamesGrid">
                    <!-- Games will be populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
