<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parlay Generator - NFL Betting</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🏈 NFL Betting Hub</h1>
            <ul class="nav-links">
                <li><a href="index.html">Schedule</a></li>
                <li><a href="teams.html">Teams</a></li>
                <li><a href="index.html#best-bets">Best Bets</a></li>
                <li><a href="index.html#best-props">Best Props</a></li>
                <li><a href="parlay-generator.html" class="active">Parlays</a></li>
            </ul>
        </div>
    </nav>

    <div class="container parlay-container">
        <h1>Parlay Generator</h1>

        <div class="parlay-layout">
            <!-- Configuration Panel -->
            <div class="parlay-config">
                <div class="config-section">
                    <h3>Select Games</h3>
                    <div class="game-selector" id="gameSelector">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <div class="config-section">
                    <h3>Parlay Settings</h3>
                    <div class="settings-group">
                        <label>Number of Legs:</label>
                        <div class="number-selector">
                            <button class="num-btn" id="decreaseLegs">-</button>
                            <input type="number" id="numLegs" value="3" min="2" max="12">
                            <button class="num-btn" id="increaseLegs">+</button>
                        </div>
                    </div>

                    <div class="settings-group">
                        <label>Risk Category:</label>
                        <div class="category-buttons">
                            <button class="category-btn" data-category="conservative">
                                <span class="category-icon">🛡️</span>
                                Conservative
                                <span class="category-desc">-200 to -110</span>
                            </button>
                            <button class="category-btn active" data-category="moderate">
                                <span class="category-icon">⚖️</span>
                                Moderate
                                <span class="category-desc">-110 to +150</span>
                            </button>
                            <button class="category-btn" data-category="lotto">
                                <span class="category-icon">🎰</span>
                                Lotto
                                <span class="category-desc">+150 to +500</span>
                            </button>
                        </div>
                    </div>

                    <div class="settings-group">
                        <label>
                            <input type="checkbox" id="sameGameParlay">
                            Same Game Parlay
                        </label>
                    </div>

                    <button class="generate-btn" id="generateParlay">Generate Parlays</button>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="parlay-results">
                <div class="results-header">
                    <h3>Recommended Parlays</h3>
                    <div class="results-count" id="resultsCount">0 parlays generated</div>
                </div>

                <div class="parlay-cards" id="parlayCards">
                    <div class="empty-state">
                        <p>Configure your parlay settings and click "Generate Parlays" to see recommendations</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/parlay-generator.js"></script>
</body>
</html>
