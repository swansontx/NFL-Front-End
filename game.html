<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Matchup - NFL Betting Hub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🏈 NFL Betting Hub</h1>
            <ul class="nav-links">
                <li><a href="index.html">Schedule</a></li>
                <li><a href="props.html">Props Builder</a></li>
            </ul>
        </div>
    </nav>

    <div class="container game-page-container">
        <a href="index.html" class="back-link">← Back to Schedule</a>

        <!-- Game Header -->
        <div class="game-page-header" id="gameHeader">
            <!-- Populated by JavaScript -->
        </div>

        <!-- Main Content -->
        <div class="game-content">
            <!-- Weather & Injuries Row -->
            <div class="game-info-row">
                <!-- Weather Section -->
                <section class="game-section game-section-half">
                    <h2>Weather</h2>
                    <div id="gameWeather">
                        <!-- Populated by JavaScript -->
                    </div>
                </section>

                <!-- Injuries Section -->
                <section class="game-section game-section-half">
                    <h2>Injuries</h2>
                    <div id="gameInjuries">
                        <!-- Populated by JavaScript -->
                    </div>
                </section>
            </div>

            <!-- Game Insights Section -->
            <section class="game-section">
                <h2>Game Insights</h2>
                <p class="section-subtitle">Key matchup analysis and betting angles</p>
                <div id="gameInsights">
                    <!-- Populated by JavaScript -->
                </div>
            </section>

            <!-- Top Props Section -->
            <section class="game-section">
                <h2>Top 12 Props</h2>
                <p class="section-subtitle">Best value props for this matchup</p>
                <div id="gameTopProps">
                    <!-- Populated by JavaScript -->
                </div>
            </section>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/matchup.js"></script>
</body>
</html>
