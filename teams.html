<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Teams - NFL Betting Hub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🏈 NFL Betting Hub</h1>
            <ul class="nav-links">
                <li><a href="index.html">Schedule</a></li>
                <li><a href="teams.html" class="active">Teams</a></li>
                <li><a href="#best-bets">Best Bets</a></li>
                <li><a href="#best-props">Best Props</a></li>
                <li><a href="parlay-generator.html">Parlays</a></li>
            </ul>
        </div>
    </nav>

    <div class="container detail-container">
        <div class="page-header">
            <h1>NFL Teams</h1>
            <p class="page-subtitle">Team stats, schedules, and insights for the 2024 season</p>
        </div>

        <!-- Conference Tabs -->
        <div class="conference-tabs">
            <button class="conference-tab active" data-conference="all">All Teams</button>
            <button class="conference-tab" data-conference="AFC">AFC</button>
            <button class="conference-tab" data-conference="NFC">NFC</button>
        </div>

        <!-- Division Filters -->
        <div class="division-filters" id="divisionFilters">
            <button class="division-filter active" data-division="all">All</button>
            <button class="division-filter" data-division="AFC East">AFC East</button>
            <button class="division-filter" data-division="AFC North">AFC North</button>
            <button class="division-filter" data-division="AFC South">AFC South</button>
            <button class="division-filter" data-division="AFC West">AFC West</button>
            <button class="division-filter" data-division="NFC East">NFC East</button>
            <button class="division-filter" data-division="NFC North">NFC North</button>
            <button class="division-filter" data-division="NFC South">NFC South</button>
            <button class="division-filter" data-division="NFC West">NFC West</button>
        </div>

        <!-- Teams Grid -->
        <div class="teams-grid" id="teamsGrid">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/teams.js"></script>
</body>
</html>
