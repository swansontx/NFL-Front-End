<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Standings - NFL Betting Hub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🏈 NFL Betting Hub</h1>
            <ul class="nav-links">
                <li><a href="index.html">Schedule</a></li>
                <li><a href="teams.html">Teams</a></li>
                <li><a href="standings.html" class="active">Standings</a></li>
                <li><a href="props-tools.html">Props Tools</a></li>
                <li><a href="parlay-generator.html">Parlays</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>🏆 NFL Standings</h1>
            <p class="page-subtitle">Current division and conference standings</p>
        </div>

        <!-- AFC Conference -->
        <section class="standings-conference">
            <h2 class="conference-title">AFC</h2>
            <div class="divisions-grid" id="afcDivisions">
                <!-- Populated by JavaScript -->
            </div>
        </section>

        <!-- NFC Conference -->
        <section class="standings-conference">
            <h2 class="conference-title">NFC</h2>
            <div class="divisions-grid" id="nfcDivisions">
                <!-- Populated by JavaScript -->
            </div>
        </section>

        <!-- Playoff Picture -->
        <section class="playoff-picture">
            <h2>📊 Playoff Picture</h2>
            <div class="playoff-grid">
                <div class="playoff-conference">
                    <h3>AFC Playoff Teams</h3>
                    <div id="afcPlayoffs">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
                <div class="playoff-conference">
                    <h3>NFC Playoff Teams</h3>
                    <div id="nfcPlayoffs">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/standings.js"></script>
</body>
</html>
